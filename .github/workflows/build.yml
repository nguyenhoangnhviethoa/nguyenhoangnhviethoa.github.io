# Tự chạy "node build.js" mỗi khi games.js/app.js/style.css (hoặc build.js) thay đổi,
# rồi commit trang game/<id>.html, sitemap.xml và số ?v= chống lưu tạm ngược lại repo.
# Trường chỉ cần sửa games.js như trước, không phải chạy gì thêm.
name: build
on:
  push:
    branches: [main]
    paths: [games.js, app.js, style.css, index.html, game.html, build.js, .github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node build.js
      - name: Commit kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game sitemap.xml index.html game.html 404.html them-game.html
          git diff --cached --quiet && echo "Không có gì thay đổi" || (git commit -m "build: trang game tĩnh + sitemap" && git push)
